[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vid2aud"
version = "1.0.0"
description = "Convierte video a audio liviano sin perder calidad (ffmpeg, Opus/AAC/MP3)"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "PySide6>=6.7",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools]
# Solo se instalan las dependencias; el código se ejecuta desde la carpeta.
packages = []
py-modules = []

[tool.python-programmer]
# Tipo de proyecto para check_structure.py: "app" (PySide6) o "cli".
type = "app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["resources"]

[tool.ruff.lint]
# E/F: errores básicos, I: orden de imports, UP: sintaxis moderna,
# B: errores frecuentes, SIM: simplificaciones, T20: prohíbe print.
select = ["E", "F", "I", "UP", "B", "SIM", "T20"]
# La longitud de línea la resuelve `ruff format`; no se duplica el aviso.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]

